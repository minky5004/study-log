name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 빌드·테스트에 필요한 것은 소스 읽기뿐. 기본값은 리포 설정에 따라 쓰기까지 열린다
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # v6 은 캐시를 별도 약관이 붙는 비공개 컴포넌트로 분리 — 라이선스 판단이라 v5 유지
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # --no-daemon 을 붙이지 않는 것은 액션이 post 스텝에서 데몬을 직접 정리하기 때문 —
      # 매 호출마다 데몬을 버리면 한 잡 안의 재사용만 잃는다
      - name: Build
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          # 컴파일 단계에서 실패하면 리포트 자체가 없다 — 그 경우의 경고를 띄우지 않는다
          if-no-files-found: ignore

  # 위 잡이 돌리는 것은 gradle 뿐이라 Dockerfile 이나 compose 가 깨져도 초록으로 지나간다.
  # 컨테이너 경로에는 러너가 한 번도 닿지 않는 셈이라 회귀가 머지된 뒤에야 드러난다.
  # build 뒤에 세우는 것은 컴파일 실패를 여기서 몇 분 걸려 다시 만나지 않기 위해서 —
  # 이 잡의 빨간 X 는 컨테이너 경로 문제만 가리킨다
  image:
    needs: build
    runs-on: ubuntu-latest
    # 스모크가 걸리면 기본 상한 6시간까지 러너를 붙잡는다. 이미지 빌드와 기동을 넉넉히 덮는 값
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 값을 셸 환경변수로 주지 않고 .env 에 적는다 — 두 경로는 같지 않다. .env 는 따옴표 없는
      # `$` 를 변수로 펼치고(.env.example 이 경고하는 자리), 해시가 조용히 잘려도 `$2` 로 시작하는
      # 한 부팅은 통과해 로그인만 영영 실패한다. 사람이 쓰는 형태를 그대로 밟아야 그 자리가 걸린다
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          APP_ADMIN_USERNAME=ci
          APP_ADMIN_PASSWORD_HASH='$2y$10$oXmFHYCHlk4HjeaP.c9.7u1VPGxL4Iw6eeqYvyaPK24dzNHG88FO6'
          EOF

      # --wait 는 healthcheck 가 healthy 를 낼 때까지 막는다. 준비 신호를 compose 가 이미
      # 알고 있으므로 여기서 다시 폴링 루프를 쓰지 않는다.
      # 기동 예산을 정하는 것은 이 값이 아니라 compose 의 start_period + retries(2분)다 —
      # 넘기면 컨테이너가 먼저 unhealthy 로 확정된다. 180초는 그 바깥의 상한일 뿐
      - name: Compose up
        run: docker compose up -d --build --wait --wait-timeout 180

      # healthy 는 스프링이 뜨고 DB 에 닿는다는 뜻이지 화면이 그려진다는 뜻은 아니다.
      # /logs 는 로그인 없이 열리고 조회 쿼리를 거치므로, 200 하나에 prod 프로파일 ·
      # PostgreSQL 방언 · 스키마 생성 · 템플릿 렌더가 한꺼번에 걸린다.
      #
      # 주소를 127.0.0.1 로 박는 것은 compose 가 IPv4 로만 게시하기 때문 — localhost 는 러너
      # 설정에 따라 ::1 을 먼저 잡아 접속 거부로 떨어진다
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   http://127.0.0.1:8080/logs || true)
          echo "GET /logs -> $code"
          [ "$code" = "200" ]

      # 부팅이 멈춘 자리는 러너 로그가 아니라 컨테이너 안에 남는다
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v
