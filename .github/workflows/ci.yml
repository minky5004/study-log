name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 빌드·테스트에 필요한 것은 소스 읽기뿐. 기본값은 리포 설정에 따라 쓰기까지 열린다
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # v6 은 캐시를 별도 약관이 붙는 비공개 컴포넌트로 분리 — 라이선스 판단이라 v5 유지
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # --no-daemon 을 붙이지 않는 것은 액션이 post 스텝에서 데몬을 직접 정리하기 때문 —
      # 매 호출마다 데몬을 버리면 한 잡 안의 재사용만 잃는다
      - name: Build
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          # 컴파일 단계에서 실패하면 리포트 자체가 없다 — 그 경우의 경고를 띄우지 않는다
          if-no-files-found: ignore

  # 위 잡이 돌리는 것은 gradle 뿐이라 Dockerfile 이나 compose 가 깨져도 초록으로 지나간다.
  # README 가 앞세우는 실행 예시가 `docker compose up` 이므로 그 경로를 러너가 한 번은 밟아야
  # 예시가 예시로 남는다. build 뒤에 세우는 것은 컴파일 실패를 여기서 몇 분 걸려 다시 만나지
  # 않기 위해서 — 이 잡의 빨간 X 는 이미지와 컴포즈 문제만 가리킨다
  image:
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_ADMIN_USERNAME: ci
      # 스모크 전용 해시. 이 잡은 로그인 없이 열리는 화면만 두드리므로 이 값으로 인증하지
      # 않는다 — 그래도 넣는 것은 미설정이면 부팅을 세우도록 만들어 둔 검사 때문
      APP_ADMIN_PASSWORD_HASH: '$2y$10$oXmFHYCHlk4HjeaP.c9.7u1VPGxL4Iw6eeqYvyaPK24dzNHG88FO6'
    steps:
      - uses: actions/checkout@v7

      # .env 없이 셸 환경변수만으로 올린다 — compose 의 `${...:?}` 는 둘 다에서 읽으므로
      # 이 형태가 돌면 .env 를 채운 README 의 실행도 돈다
      - name: Compose up
        run: docker compose up -d --build

      # 이미지가 만들어졌다는 것과 앱이 응답한다는 것은 다르다. /logs 는 로그인 없이 열리고
      # DB 를 거치므로, 200 하나에 이미지 · 컴포즈 배선 · healthcheck 게이팅 · prod 프로파일 ·
      # PostgreSQL 접속 · 스키마 생성이 한꺼번에 걸린다
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/logs || true)
            if [ "$code" = "200" ]; then
              echo "GET /logs -> 200 (${i}번째 시도)"
              exit 0
            fi
            sleep 2
          done
          echo "120초 안에 200 이 오지 않음 — 마지막 응답 코드 $code"
          exit 1

      # 부팅이 멈춘 자리는 러너 로그가 아니라 컨테이너 안에 남는다
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v
