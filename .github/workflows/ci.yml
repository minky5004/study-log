name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 빌드·테스트에 필요한 것은 소스 읽기뿐. 기본값은 리포 설정에 따라 쓰기까지 열린다
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # v6 은 캐시를 별도 약관이 붙는 비공개 컴포넌트로 분리 — 라이선스 판단이라 v5 유지
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # --no-daemon 을 붙이지 않는 것은 액션이 post 스텝에서 데몬을 직접 정리하기 때문 —
      # 매 호출마다 데몬을 버리면 한 잡 안의 재사용만 잃는다
      - name: Build
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          # 컴파일 단계에서 실패하면 리포트 자체가 없다 — 그 경우의 경고를 띄우지 않는다
          if-no-files-found: ignore
