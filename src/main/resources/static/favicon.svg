<?xml version="1.0" encoding="UTF-8"?>
<!--
  잔디 히트맵을 3x3 으로 줄인 것. 이 앱에서 한 눈에 알아보는 형태가 그것 하나다.

  색은 app.css 의 `.hm-1` ~ `.hm-4` 를 그대로 옮겼다 — 그쪽은 `color-mix(in srgb, var(--accent) N%,
  var(--panel))` 이고 여기는 계산해 박은 값이다. 외부 SVG 는 문서의 CSS 변수를 받지 못해 hex 를
  한 벌 더 갖는 수밖에 없다. 팔레트를 바꾸면 이 파일도 같이 고친다.

  왼쪽 위 한 칸만 빈칸(`--line`) 으로 두어 격자가 규칙적인 무늬로 보이지 않게 한다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <rect width="32" height="32" rx="7" fill="#14181c"/>

    <rect x="5" y="5" width="6" height="6" rx="1.5" fill="#2b333b"/>
    <rect x="13" y="5" width="6" height="6" rx="1.5" fill="#145b35"/>
    <rect x="21" y="5" width="6" height="6" rx="1.5" fill="#0e813e"/>

    <rect x="5" y="13" width="6" height="6" rx="1.5" fill="#145b35"/>
    <rect x="13" y="13" width="6" height="6" rx="1.5" fill="#0e813e"/>
    <rect x="21" y="13" width="6" height="6" rx="1.5" fill="#07b049"/>

    <rect x="5" y="21" width="6" height="6" rx="1.5" fill="#0e813e"/>
    <rect x="13" y="21" width="6" height="6" rx="1.5" fill="#07b049"/>
    <rect x="21" y="21" width="6" height="6" rx="1.5" fill="#00e054"/>
</svg>
