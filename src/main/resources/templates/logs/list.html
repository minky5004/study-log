<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>기록 · study-log</title>
</head>
<body>
<main class="container">
    <div class="page-head">
        <div>
            <h1>기록</h1>
            <p class="lead" th:unless="${logs.isEmpty()}">
                <span th:text="${logs.totalElements}">0</span>개의 세션
            </p>
        </div>
        <!-- 비로그인에게는 감춘다 — 눌러야 로그인 화면이 나오는 버튼은 안내가 아니라 막다른 길 -->
        <div class="page-actions" sec:authorize="isAuthenticated()">
            <a class="button button-quiet" th:href="@{/import}">가져오기</a>
            <a class="button button-quiet" th:href="@{/export}">내보내기</a>
            <a class="button" th:href="@{/logs/new}">새 기록</a>
        </div>
    </div>

    <!-- GET 으로 보내야 검색 결과 주소가 공유·새로고침에서 살아남는다 -->
    <form class="search" method="get" th:object="${cond}" th:action="@{/logs}">
        <label class="field search-keyword">
            <span class="field-sublabel">키워드</span>
            <input type="search" th:field="*{keyword}" placeholder="제목 · 요약 · 노트 본문">
        </label>
        <label class="field">
            <span class="field-sublabel">분야</span>
            <input type="text" th:field="*{categoryName}" list="category-options" placeholder="전체">
        </label>
        <label class="field">
            <!-- 검색은 태그 한 개짜리 입력이라 폼과 달리 스크립트가 필요 없다 -->
            <span class="field-sublabel">태그</span>
            <input type="text" th:field="*{tag}" list="tag-options" placeholder="전체">
        </label>
        <label class="field">
            <span class="field-sublabel">시작일</span>
            <input type="date" th:field="*{from}">
        </label>
        <label class="field">
            <span class="field-sublabel">종료일</span>
            <input type="date" th:field="*{to}">
        </label>
        <div class="search-actions">
            <button class="button" type="submit">검색</button>
            <a class="button button-quiet" th:unless="${cond.empty}" th:href="@{/logs}">초기화</a>
        </div>
    </form>

    <p class="empty" th:if="${logs.isEmpty() and cond.empty}">
        아직 기록이 없습니다. 첫 세션을 남기면 여기에 쌓입니다.
    </p>
    <!--
      결과가 비어 보이는 이유를 그 자리에서 대신 말한다. 폼 안에 두면 `.search` 가
      align-items: flex-end 라 이 줄만큼 다른 칸들이 내려가 종료일 칸이 시작일과 어긋난다
    -->
    <p class="empty" th:if="${cond.rangeReversed}">
        종료일이 시작일보다 앞섭니다. 기간을 다시 골라 보세요.
    </p>

    <!-- 역전된 기간에는 이 문구를 내지 않는다. 둘이 함께 뜨면 조건을 넓히려 들어 진짜 이유를 지나친다 -->
    <p class="empty" th:if="${logs.isEmpty() and !cond.empty and !cond.rangeReversed}">
        조건에 맞는 기록이 없습니다. 조건을 넓히거나 초기화해 보세요.
    </p>

    <th:block th:replace="~{fragments/day-list :: days(${days}, true)}"></th:block>

    <nav class="pager" th:if="${logs.totalPages > 1}">
        <!-- 주소는 컨트롤러가 만든다 — 검색 조건을 싣는 규칙이 리다이렉트와 한 곳이어야 한다 -->
        <a th:if="${prevPageUrl}" th:href="${prevPageUrl}">이전</a>
        <span th:text="${logs.number + 1} + ' / ' + ${logs.totalPages}">1 / 1</span>
        <a th:if="${nextPageUrl}" th:href="${nextPageUrl}">다음</a>
    </nav>

    <th:block th:replace="~{fragments/suggest :: datalists}"></th:block>
</main>
</body>
</html>
