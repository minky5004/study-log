<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>기록 삭제 · study-log</title>
</head>
<body>
<main class="container container-narrow">
    <div class="page-head">
        <h1>이 기록을 지울까요?</h1>
    </div>
    <p class="lead">되돌릴 수 없습니다. 지우기 전에 무엇이 사라지는지 확인하세요.</p>

    <article class="entry doomed">
        <header class="entry-head">
            <h2 class="entry-title" th:text="${log.title()}">자료 구조 복습</h2>
            <p class="entry-meta">
                <span class="entry-category" th:classappend="'cat-' + ${log.categoryColorIndex()}"
                      th:text="${log.categoryName()}">CS</span>
                <time th:datetime="${log.studyDate()}" th:text="${log.studyDateText()}">8월 6일 (목)</time>
                <span th:text="${#temporals.format(log.startTime(), 'HH:mm')} + '–'
                        + ${#temporals.format(log.endTime(), 'HH:mm')}">14:00–15:20</span>
                <span th:text="${log.durationText()}">1시간 20분</span>
            </p>
            <p class="entry-tags" th:unless="${log.tags().isEmpty()}">
                <span class="session-tag" th:each="tag : ${log.tags()}"
                      th:text="'#' + ${tag}">#큐</span>
            </p>
        </header>

        <p class="entry-summary" th:if="${!#strings.isEmpty(log.summary())}"
           th:text="${log.summary()}">큐와 스택 정리</p>

        <!--
          노트는 상세와 같은 새니타이즈를 마친 HTML. 앞부분만 보이도록 자르는 것은 CSS 로 —
          HTML 문자열을 길이로 자르면 태그가 반쪽만 남아 남은 화면까지 무너진다
        -->
        <div class="note note-preview" th:if="${!#strings.isEmpty(log.noteHtml())}"
             th:utext="${log.noteHtml()}"></div>
        <p class="lead" th:if="${#strings.isEmpty(log.noteHtml())}">노트 없이 시간만 남긴 세션입니다.</p>
    </article>

    <nav class="entry-nav confirm-actions">
        <a class="button button-quiet" th:href="@{/logs/{id}(id=${log.id()})}">취소</a>
        <form th:action="@{/logs/{id}/delete(id=${log.id()})}" method="post">
            <button type="submit" class="button button-danger">삭제</button>
        </form>
    </nav>
</main>
</body>
</html>
