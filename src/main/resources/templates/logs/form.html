<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="${form.id} == null ? '새 기록 · study-log' : '기록 수정 · study-log'">새 기록 · study-log</title>
</head>
<body>
<!-- 생성·수정 겸용. 갈리는 것은 제출 주소와 문구뿐이라 폼을 둘로 두지 않는다 -->
<main class="container container-narrow" th:with="editing=${form.id != null}">
    <div class="page-head">
        <h1 th:text="${editing} ? '기록 수정' : '새 기록'">새 기록</h1>
        <a class="button button-quiet"
           th:href="${editing} ? @{/logs/{id}(id=${form.id})} : @{/logs}"
           th:text="${editing} ? '취소' : '목록으로'">목록으로</a>
    </div>

    <form class="form" method="post" th:object="${form}"
          th:action="${editing} ? @{/logs/{id}(id=${form.id})} : @{/logs}">
        <label class="field">
            <span class="field-label">제목</span>
            <input type="text" th:field="*{title}" autofocus
                   placeholder="무엇을 공부했는지 한 줄로">
            <span class="field-error" th:if="${#fields.hasErrors('title')}"
                  th:errors="*{title}">오류</span>
        </label>

        <fieldset class="field-row">
            <legend class="field-label">언제</legend>
            <label class="field">
                <span class="field-sublabel">날짜</span>
                <input type="date" th:field="*{studyDate}">
                <span class="field-error" th:if="${#fields.hasErrors('studyDate')}"
                      th:errors="*{studyDate}">오류</span>
            </label>
            <label class="field">
                <span class="field-sublabel">시작</span>
                <input type="time" th:field="*{startTime}">
                <span class="field-error" th:if="${#fields.hasErrors('startTime')}"
                      th:errors="*{startTime}">오류</span>
            </label>
            <label class="field">
                <span class="field-sublabel">종료</span>
                <input type="time" th:field="*{endTime}">
                <span class="field-error" th:if="${#fields.hasErrors('endTime')}"
                      th:errors="*{endTime}">오류</span>
            </label>
        </fieldset>
        <p class="field-hint">종료가 시작보다 이르면 다음 날로 계산합니다.</p>

        <fieldset class="field-row">
            <legend class="field-label">무엇을</legend>
            <label class="field">
                <span class="field-sublabel">분야</span>
                <input type="text" th:field="*{categoryName}" list="category-options"
                       placeholder="Spring">
                <span class="field-error" th:if="${#fields.hasErrors('categoryName')}"
                      th:errors="*{categoryName}">오류</span>
            </label>
            <label class="field">
                <span class="field-sublabel">태그</span>
                <!-- 쉼표로 여러 개를 받는 칸이라 제안이 마지막 토큰에 걸리도록 스크립트가 붙는다 -->
                <input type="text" th:field="*{tagsCsv}" list="tag-options" data-tag-suggest
                       placeholder="jpa, 트랜잭션">
                <span class="field-error" th:if="${#fields.hasErrors('tagsCsv')}"
                      th:errors="*{tagsCsv}">오류</span>
            </label>
        </fieldset>

        <label class="field">
            <span class="field-label">요약</span>
            <input type="text" th:field="*{summary}" placeholder="목록에 함께 보일 한 줄">
            <span class="field-error" th:if="${#fields.hasErrors('summary')}"
                  th:errors="*{summary}">오류</span>
        </label>

        <label class="field">
            <span class="field-label">노트</span>
            <textarea th:field="*{note}" rows="12" placeholder="마크다운으로 자유롭게"></textarea>
        </label>

        <div class="form-actions">
            <button type="submit" class="button"
                    th:text="${editing} ? '수정 저장' : '기록 저장'">기록 저장</button>
        </div>
    </form>

    <th:block th:replace="~{fragments/suggest :: datalists}"></th:block>
    <script th:src="@{/js/tag-suggest.js}" defer></script>
</main>
</body>
</html>
