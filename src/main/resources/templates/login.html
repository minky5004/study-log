<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>로그인 · study-log</title>
</head>
<body>
<main class="container container-narrow">
    <div class="page-head">
        <h1>로그인</h1>
        <a class="button button-quiet" th:href="@{/logs}">목록으로</a>
    </div>

    <!-- 실패 사유를 아이디·비밀번호로 갈라 알리지 않는다 — 어느 쪽이 맞았는지 알려 주는 셈 -->
    <p class="field-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

    <form class="form" method="post" th:action="@{/login}">
        <label class="field">
            <span class="field-label">아이디</span>
            <input type="text" name="username" autocomplete="username" autofocus>
        </label>
        <label class="field">
            <span class="field-label">비밀번호</span>
            <input type="password" name="password" autocomplete="current-password">
        </label>
        <div class="form-actions">
            <button type="submit" class="button">로그인</button>
        </div>
    </form>
</main>
</body>
</html>
