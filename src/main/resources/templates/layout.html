<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">study-log</title>
    <!--
      선언이 없으면 브라우저가 /favicon.ico 를 스스로 찾고, 없는 그 요청이 4xx 템플릿을 통째로
      렌더링한다. SVG 한 장으로 두는 것은 크기별 png 를 쌓지 않기 위해서
    -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">study-log</a>
    <nav>
        <a th:href="@{/logs}">기록</a>
        <a th:href="@{/stats}">통계</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
        <!-- 로그아웃은 상태를 바꾸므로 링크가 아니라 폼 — GET 으로 두면 링크 프리페치에도 반응한다 -->
        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
            <button type="submit" class="link-button">로그아웃</button>
        </form>
    </nav>
</header>
<main th:replace="${content}"></main>
</body>
</html>
