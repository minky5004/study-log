<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">study-log</title>
    <!--
      두 벌을 두는 이유는 서로 다른 것을 막기 때문이다. SVG 는 크기별 png 를 쌓지 않고 탭 아이콘을
      내주고, .ico 는 /favicon.ico 를 무조건 두드리는 쪽(크롤러 · 미리보기 봇 · 옛 사파리)이 없는
      주소에 닿아 4xx 템플릿을 통째로 렌더링하는 것을 막는다. 선언만으로는 뒤엣것이 닫히지 않는다.
      그림은 같고 .ico 는 SVG 를 옮겨 그린 것이라, 팔레트를 바꾸면 둘 다 고친다
    -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="icon" sizes="32x32" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">study-log</a>
    <nav>
        <a th:href="@{/logs}">기록</a>
        <a th:href="@{/plans}">계획</a>
        <a th:href="@{/stats}">통계</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
        <!-- 로그아웃은 상태를 바꾸므로 링크가 아니라 폼 — GET 으로 두면 링크 프리페치에도 반응한다 -->
        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
            <button type="submit" class="link-button">로그아웃</button>
        </form>
    </nav>
</header>
<main th:replace="${content}"></main>
</body>
</html>
