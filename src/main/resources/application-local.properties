spring.datasource.url=jdbc:h2:file:./data/study-log;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# 마이그레이션은 PostgreSQL 방언으로 쓴다. H2 가 `MODE=PostgreSQL` 로도 방언을 재현하지 못한다는
# 것은 이 리포가 두 번 겪은 일이라, 그 H2 위에서 같은 SQL 이 도는지는 아무것도 증명하지 못한다.
# 로컬 스키마는 계속 하이버네이트가 만들고, 마이그레이션의 검증은 리포지토리 테스트와 컨테이너가 진다
spring.flyway.enabled=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
logging.level.org.hibernate.SQL=debug

# remember-me 토큰 테이블만 스크립트로 만든다. 하이버네이트는 엔티티가 있는 것만 만드는데
# persistent_logins 에는 엔티티가 없고(JdbcTemplate 이 읽고 쓴다), 위에서 Flyway 를 껐으므로
# 로컬에는 그 테이블을 만들 주체가 없다. 정본은 V3 이고 아래 파일은 사본이다
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/local/persistent_logins.sql
