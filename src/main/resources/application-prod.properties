# 접속정보는 전부 환경변수 — 로컬 프로파일과 달리 기본값을 두지 않는다.
# 미설정이면 부팅이 실패하고, 그 실패가 엉뚱한 DB 에 붙는 것보다 낫다
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway 가 소유하고 하이버네이트는 대조만 한다. `update` 로 두었을 때 실제로 물린 것은
# tag_order 추가였다 — DDL 이 실패했는데 WARN 한 줄만 남기고 부팅에 성공해, 목록이 500 인 채로
# 떠 있었다. validate 는 같은 상황에서 뜨지 않는다
spring.jpa.hibernate.ddl-auto=validate

# 이미 돌고 있는 볼륨에는 표가 있고 이력표가 없다. 그 상태를 버전 1 로 표시하고 V1 을 건너뛴다 —
# 없으면 Flyway 가 "비어 있지 않은 스키마" 라며 부팅을 막는다. 새 DB 는 비어 있으므로 V1 이 그대로 돈다.
#
# V2 를 더하는 날 이 두 줄을 뺀다. 이 설정은 이력표 없는 스키마를 조건 없이 버전 1 로 찍으므로,
# 그때부터는 이력표 없이 복원된 DB 가 이미 가진 V2 를 다시 붓다 죽는다. 그 상황에서는 부팅을
# 막는 쪽이 옳다 — 여기 있는 유일한 이유는 지금 도는 볼륨 하나를 넘기는 것뿐이다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 컨테이너 밖에서 포트를 정해 주는 실행 환경(PaaS 등)을 위한 자리 — 없으면 8080
server.port=${PORT:8080}

# 개발 편의용 셋을 되돌린다. h2console 은 의존성에 남아 있으므로 끄는 것으로 막는다
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
logging.level.org.hibernate.SQL=warn
