# 접속정보는 전부 환경변수 — 로컬 프로파일과 달리 기본값을 두지 않는다.
# 미설정이면 부팅이 실패하고, 그 실패가 엉뚱한 DB 에 붙는 것보다 낫다
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway 가 소유하고 하이버네이트는 대조만 한다. `update` 로 두었을 때 실제로 물린 것은
# tag_order 추가였다 — DDL 이 실패했는데 WARN 한 줄만 남기고 부팅에 성공해, 목록이 500 인 채로
# 떠 있었다. validate 는 같은 상황에서 뜨지 않는다
spring.jpa.hibernate.ddl-auto=validate

# `baseline-on-migrate` 를 두지 않는다. 08-11 에 이력표 없이 돌던 볼륨 하나를 넘기려고 켰던
# 설정이고, 그 볼륨이 버전 1 로 찍힌 것을 실측한 뒤 걷었다 — 더 지고 갈 이유가 없다.
#
# 부팅이 "비어 있지 않은 스키마" 로 막히면 되붙이지 말고 그 DB 의 이력표부터 본다. 이 설정은
# 이력표 없는 스키마를 조건 없이 버전 1 로 찍으므로, 뒤에 붙는 마이그레이션을 이미 가진 DB 에
# 켜면 아직 안 부은 것으로 보고 다시 붓다 죽는다 — 그 상황에서는 부팅을 막는 쪽이 옳다

# 적용이 끝난 마이그레이션 파일은 주석 한 줄도 고치지 않는다. checksum 이 파일 전체로 계산되므로
# 주석만 바꿔도 값이 달라지고, 그 파일을 SQL 타입으로 이미 적용한 DB 에서는 부팅의 validate 가
# 불일치를 잡아 앱이 뜨지 않는다. 08-16 에 실제로 물린 자리다 — V1 헤더의 시제를 고쳐 운영 배포가
# status 1 로 죽었는데, 로컬 볼륨은 같은 V1 이 BASELINE 타입이라 checksum 자체가 없어 끝까지
# 초록이었다. 그래서 고칠 수 없게 된 설명은 db/migration/NOTES.md 의 정오표에 쌓는다 —
# 마이그레이션을 여는 사람이 그 자리에서 보게

# 컨테이너 밖에서 포트를 정해 주는 실행 환경(PaaS 등)을 위한 자리 — 없으면 8080
server.port=${PORT:8080}

# 개발 편의용 셋을 되돌린다. h2console 은 의존성에 남아 있으므로 끄는 것으로 막는다
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
logging.level.org.hibernate.SQL=warn
