# 접속정보는 전부 환경변수 — 로컬 프로파일과 달리 기본값을 두지 않는다.
# 미설정이면 부팅이 실패하고, 그 실패가 엉뚱한 DB 에 붙는 것보다 낫다
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update 는 더하기만 한다 — 컬럼을 지우거나 이름을 바꾸면 옛 컬럼이 not null 인 채로 남아
# 그 뒤 저장이 전부 실패한다. 그때가 Flyway 를 들일 시점이고, 그 전까지는 엔티티에서
# 필드를 빼는 변경을 이 볼륨 위에서 하지 않는다
spring.jpa.hibernate.ddl-auto=update

# 컨테이너 밖에서 포트를 정해 주는 실행 환경(PaaS 등)을 위한 자리 — 없으면 8080
server.port=${PORT:8080}

# 개발 편의용 셋을 되돌린다. h2console 은 의존성에 남아 있으므로 끄는 것으로 막는다
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
logging.level.org.hibernate.SQL=warn
