spring.application.name=study-log
spring.profiles.active=local
spring.thymeleaf.cache=false
# 뷰 렌더링 중 지연 로딩이 조용히 성공하는 것을 막아 N+1 을 개발 단계에서 예외로 드러낸다
spring.jpa.open-in-view=false

# 가져오기가 받는 것은 내보낸 ZIP 한 덩어리다. 기본값 1MB 면 기록 수백 건짜리 백업이
# 화면에 닿기도 전에 거부된다. 20MB 는 실측 기준 — 119건 백업이 48KB 라 5만 건 몫이다.
# 더 키우지 않는 것은 CSRF 검사가 인증보다 앞서 본문을 먼저 임시 파일로 받기 때문
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 컨테이너 healthcheck 가 물어보는 자리. 노출을 health 하나로 못박는 것은 기본값에 기대지
# 않기 위해서 — 스타터가 하나 늘 때마다 열리는 끝점이 따라 느는 쪽이 액추에이터의 기본 성질이다.
# /actuator/health 는 GET 이라 권한 바닥값에서 공개다. 세부를 감추면 나가는 것은 종합 상태와
# 그룹 이름뿐 — DB 벤더 · 검증 쿼리 · 디스크 여유는 판정에는 쓰이되 응답에는 실리지 않는다
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# 노출 목록에 없는 끝점도 `/actuator` 목록에는 이름이 실린다. 링크 두 줄이 새는 것이 문제가
# 아니라, "health 밖은 없다" 는 말이 사실이 아니게 되는 것이 문제다
management.endpoints.web.discovery.enabled=false

# 컨테이너 healthcheck 전용 그룹. 복합 health 에는 `diskSpace`(여유 10MB 미만이면 DOWN) 와
# `ssl` 이 함께 걸려 있어, 그대로 두면 호스트 디스크가 마른 것만으로 화면이 멀쩡한 앱이
# unhealthy 가 되고 CI 는 이번 변경과 무관한 이유로 빨개진다. 컨테이너가 알고 싶은 것은
# "요청을 받아 DB 까지 닿는가" 뿐이라 둘로 좁힌다.
# 내장 `readiness` 로 대신하지 않는 것은 그쪽이 `readinessState` 하나라 DB 를 보지 않기 때문
management.endpoint.health.group.container.include=db,ping

# 관리자 계정은 환경변수 전용 — 기본값을 두면 그것이 리포에 박힌 자격증명이 된다.
# 미설정이면 부팅이 실패하고, 그 실패가 조용히 열린 계정보다 낫다
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password-hash=${APP_ADMIN_PASSWORD_HASH}
