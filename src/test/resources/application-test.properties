# 컨텍스트마다 다른 DB 이름 — 캐시된 컨텍스트끼리 create-drop 으로 서로의 스키마를 지우는 것 방지
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# H2 로 도는 테스트에서는 Flyway 를 끈다 — 마이그레이션이 PostgreSQL 방언이라 여기서 돌려 봐야
# 증명되는 것이 없다. 실제 엔진 위에서 켜는 곳은 리포지토리 테스트 한 곳이고, 거기서만
# `validate` 로 바꿔 엔티티와 마이그레이션이 갈라지는 것을 잡는다
spring.flyway.enabled=false

# 쿼리 수를 세는 계측 — 목록 N+1 회귀를 잡는 유일한 수단이라 테스트 전용으로 켠다
spring.jpa.properties.hibernate.generate_statistics=true

# 테스트 픽스처 계정. 환경변수 대신 여기 두는 것은 러너와 IDE 단독 실행을 한 번에 덮기 위해서 —
# CI 에 시크릿을 매달면 IDE 실행은 여전히 부팅에 실패한다.
# 테스트 클래스패스에만 있어 배포 아티팩트에는 실리지 않는다. 해시는 `test-password` 의 BCrypt
